[pytest]
# 题解根目录，以后新增 lcp/ 这类同级目录就在这里加一项。
# structures/python 是共享数据结构自己的测试——那些辅助是所有树/链表题的地基，
# 写错了会让题解测试给出假结果，所以必须跟着跑。
testpaths = leetcode structures/python scripts

# 题解测试叫 solution_test.py，不是 pytest 默认的 test_*.py，两种都认一下。
python_files = *_test.py test_*.py

# importlib 模式不依赖 sys.path，几百个同名 solution_test.py 才不会互相顶替。
# 题解模块由根目录 conftest.py 的 solution fixture 按路径加载。
addopts = --import-mode=importlib

# 排除 IDE 的编译输出目录。IDEA 把题目目录当项目打开时会在里面建 out/，并且把
# 所有非 .java 文件当资源复制进去——包括 solution.py 和 solution_test.py 的旧副本。
# 不排除的话 pytest 会把那份旧副本也收集了：旧题解配旧测试，永远是绿的，
# 但它早就不是你在写的那份了。
#
# 列表里前面那些是 pytest 的默认值，这里显式写出来是因为一旦设了 norecursedirs
# 就会整个覆盖默认值，漏写等于把默认的排除项也关掉了。
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} out

# pytest 默认把非 ASCII 的用例 id 转义成 \uXXXX，中文用例名会变成一串乱码。
# 这个选项名字很长是 pytest 作者故意的（劝退），但行为本身没问题。
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
