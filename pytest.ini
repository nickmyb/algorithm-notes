[pytest]
# 题解根目录，以后新增 lcp/ 这类同级目录就在这里加一项。
# structures/python 是共享数据结构自己的测试——那些辅助是所有树/链表题的地基，
# 写错了会让题解测试给出假结果，所以必须跟着跑。
testpaths = leetcode structures/python

# 题解测试叫 solution_test.py，不是 pytest 默认的 test_*.py，两种都认一下。
python_files = *_test.py test_*.py

# importlib 模式不依赖 sys.path，几百个同名 solution_test.py 才不会互相顶替。
# 题解模块由根目录 conftest.py 的 solution fixture 按路径加载。
addopts = --import-mode=importlib
