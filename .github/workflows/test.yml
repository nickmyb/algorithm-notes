name: Test

on:
  # push 不限分支：dev 之类的试验分支推上去也验一遍，不用先合进 main 才知道有没有坏。
  push:
  pull_request:
    branches: [main, template]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # 用 go.mod 里声明的版本，和本地保持一致

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: TEST_TEMPLATE=1 bash ./gotest.sh

      - name: Show coverage gaps # 打印总覆盖率和未达 100% 的函数，方便定位
        if: always()
        run: |
          echo "===== TOTAL ====="
          go tool cover -func=coverage.txt | tail -n 1
          echo "===== functions below 100% ====="
          go tool cover -func=coverage.txt | grep -v '100.0%' || true

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.txt

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Python version
        id: python-version
        run: |
          version="$(sed -n 's/^PYTHON_MIN=//p' scripts/init.sh)"
          # 解析不到就直接失败。上一版没有这道检查，改了 init.sh 的变量名之后
          # 它静默产出 "."，错误要等到 setup-python 才暴露出来。
          test -n "$version" || { echo "没能从 scripts/init.sh 解析出 PYTHON_MIN"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python-version.outputs.version }}

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Test
        run: TEST_TEMPLATE=1 PYTEST=pytest bash ./pytest.sh

  java:
    name: Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Java version
        id: java-version
        run: |
          version="$(sed -n 's/^JAVA_RELEASE="${JAVA_RELEASE:-\([0-9]*\)}"/\1/p' javatest.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.java-version.outputs.version }}

      - name: Test
        run: TEST_TEMPLATE=1 bash ./javatest.sh
